# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "be38a061f8e91edc122e790f92bc2d96"
name = "BadgeFlow"
application_url = "https://dev.badgeflow.mpctrades.com"
embedded = true

[access_scopes]
# read_products: badge targeting (products/collections). The app embed's
# on/off status comes from App Bridge app.extensions(), which needs no scope.
# No write scopes — keeps App Store review simple.
scopes = "read_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory GDPR compliance webhooks — required for every public app.
  # These use `compliance_topics`, not `topics` (that field is for regular
  # event webhooks only).
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://dev.badgeflow.mpctrades.com/auth/callback", "https://dev.badgeflow.mpctrades.com/auth/shopify/callback", "https://dev.badgeflow.mpctrades.com/api/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
