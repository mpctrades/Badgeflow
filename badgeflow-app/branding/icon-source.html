<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- background: full-bleed flat square, no rounding — Shopify applies its own corner mask -->
  <rect x="0" y="0" width="1200" height="1200" fill="#E25C07" />

  <!-- tag / badge mark -->
  <g transform="translate(600,600) rotate(-16)">
    <!-- tag body: pointed left, rounded right corners -->
    <path d="
      M -330 0
      L -170 -175
      Q -150 -195 -122 -195
      L 250 -195
      Q 290 -195 290 -155
      L 290 155
      Q 290 195 250 195
      L -122 195
      Q -150 195 -170 175
      Z"
      fill="#FFFFFF" />
    <!-- punch hole -->
    <circle cx="-118" cy="0" r="54" fill="#E25C07" />
    <!-- flow swoosh across the tag -->
    <path d="M -40 60 Q 90 -40 260 -60"
      fill="none" stroke="#F07A2E" stroke-width="34" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
</body>
</html>
